services:
  db:
    image: postgres:latest
    container_name: aad_db_container
    restart: always
    environment:
      POSTGRES_DB: aad
      POSTGRES_USER: root
      POSTGRES_PASSWORD: 1234
    ports:
      - "5433:5432"
    volumes:
      - db_data:/var/lib/postgresql/data

volumes:
  db_data: